<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- IC chip body -->
  <rect x="62" y="28" width="76" height="46" rx="3"
        stroke="rgba(30,64,175,0.28)" stroke-width="1.5" fill="none"/>
  <!-- Chip internal detail lines -->
  <line x1="76" y1="42" x2="136" y2="42"
        stroke="rgba(30,64,175,0.16)" stroke-width="1"/>
  <line x1="76" y1="52" x2="120" y2="52"
        stroke="rgba(30,64,175,0.16)" stroke-width="1"/>

  <!-- Top pins (exit top edge) -->
  <line x1="84"  y1="28" x2="84"  y2="0"  stroke="rgba(30,64,175,0.24)" stroke-width="1.5"/>
  <line x1="116" y1="28" x2="116" y2="0"  stroke="rgba(30,64,175,0.24)" stroke-width="1.5"/>

  <!-- Left pins (exit left edge) -->
  <line x1="62" y1="43" x2="0"   y2="43"  stroke="rgba(30,64,175,0.22)" stroke-width="1.5"/>
  <line x1="62" y1="59" x2="32"  y2="59"  stroke="rgba(30,64,175,0.22)" stroke-width="1.5"/>
  <!-- Left pin turns down to bottom edge -->
  <line x1="32" y1="59" x2="32"  y2="200" stroke="rgba(30,64,175,0.17)" stroke-width="1.5"/>
  <circle cx="32" cy="59" r="3.5" fill="rgba(30,64,175,0.26)"/>

  <!-- Right pins (exit right edge) -->
  <line x1="138" y1="43" x2="200" y2="43" stroke="rgba(30,64,175,0.22)" stroke-width="1.5"/>
  <line x1="138" y1="59" x2="168" y2="59" stroke="rgba(30,64,175,0.22)" stroke-width="1.5"/>
  <!-- Right pin turns down then exits right -->
  <line x1="168" y1="59" x2="168" y2="120" stroke="rgba(30,64,175,0.17)" stroke-width="1.5"/>
  <line x1="168" y1="120" x2="200" y2="120" stroke="rgba(30,64,175,0.17)" stroke-width="1.5"/>
  <circle cx="168" cy="59"  r="3.5" fill="rgba(30,64,175,0.26)"/>
  <circle cx="168" cy="120" r="4"
          stroke="rgba(30,64,175,0.28)" stroke-width="1.5" fill="none"/>

  <!-- Bottom-left pin: down then exits left -->
  <line x1="84" y1="74" x2="84"  y2="115" stroke="rgba(30,64,175,0.22)" stroke-width="1.5"/>
  <line x1="84" y1="115" x2="20" y2="115" stroke="rgba(30,64,175,0.17)" stroke-width="1.5"/>
  <circle cx="84" cy="115" r="4"
          stroke="rgba(30,64,175,0.28)" stroke-width="1.5" fill="none"/>

  <!-- Bottom-right pin: down then turns and routes to bottom-right -->
  <line x1="116" y1="74"  x2="116" y2="115" stroke="rgba(30,64,175,0.22)" stroke-width="1.5"/>
  <line x1="116" y1="115" x2="116" y2="160" stroke="rgba(30,64,175,0.17)" stroke-width="1.5"/>
  <circle cx="116" cy="115" r="3.5" fill="rgba(30,64,175,0.28)"/>
  <line x1="116" y1="160" x2="60" y2="160"  stroke="rgba(30,64,175,0.17)" stroke-width="1.5"/>
  <circle cx="116" cy="160" r="3.5" fill="rgba(30,64,175,0.24)"/>
  <line x1="60"  y1="160" x2="60" y2="200"  stroke="rgba(30,64,175,0.15)" stroke-width="1.5"/>
  <circle cx="60" cy="160" r="3"
          stroke="rgba(30,64,175,0.24)" stroke-width="1.5" fill="none"/>
</svg>
