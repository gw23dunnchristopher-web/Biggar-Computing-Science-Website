        <script>
            window.QUIZ_CONFIGS = {
                analysis: {
                    questions: [
                        {
                            type: "paragraph",
                            text: "Define the term 'Functional Requirements' in the context of software development.",
                            marks: 1,
                            markingScheme:
                                "Award 1 mark for 'descriptions of what the program needs to do to fulfill its purpose' or an answer with a similar meaning.",
                        },
                        {
                            type: "paragraph",
                            text: "In the analysis stage, what three specific things must be defined for a program?",
                            marks: 1,
                            markingScheme:"Award 1 mark for 'input, process and output' or an answer with a similar meaning.",
                        },
                        {
                            type: "table",
                            text: "Look at the following problem description:", "\"A program asks for a student's test score out of 50, calculates their percentage, and then displays the result.\"", "Identify the <b>Input</b>, <b>Process</b> and the <b>Output</b>.",
                            marks: 3,
                            markingScheme:
                                "Award 1 mark for correct Input - Test Score.  Award 1 mark for correct Process - Calculate percentage (the actual calculation is also valid). Award 1 mark for correct Output - Percentage",
                            tableHeaders: ["Input", "Process", "Output"],
                            columnWidths: ["33%", "33%", "33%"],
                            tableRows: [["", "", ""]]
                        },
                        {
                            type: "paragraph",
                            text: "Why is it helpful to look for 'action verbs' when reading a problem description?",
                            marks: 1,
                            markingScheme:"Award 1 mark for 'They indicate the actions/processes that need to be taken by the program.' or an answer with a similar meaning.",
                        },
                    ],
                },
                design: {
                    questions: [
                        {
                            type: "paragraph",
                            text: "What is an 'algorithm'?",
                            marks: 1,
                            markingScheme:"Award 1 mark for 'A step-by-step solution to a problem' or an answer with a similar meaning.",
                        },
                        {
                            type: "paragraph",
                            text: "Describe 'pseudocode' and explain why it is a common way to write an algorithm.",
                            marks: 2,
                            markingScheme:"Award 1 mark for 'A way of writing an algorithm that is easy to understand but not in a specific programming language. 1 mark for 'It is easy to understand and convert directly into code.' or an answer with a similar meaning.",
                        },
                        {
                            type: "paragraph",
                            text: "In a flowchart, what specific action is represented by a diamond shape?",
                            marks: 1,
                            markingScheme:"Award 1 mark for 'A decision (a point where the program takes one of two paths).",
                        },
                        {
                            type: "paragraph",
                            text: "In a flowchart, what shape is used to show both inputs and outputs?",
                            marks: 1,
                            markingScheme:"Award 1 mark for 'A parallelogram (or rhombus).",
                        },
                        {
                            type: "paragraph",
                            text: "What is a 'Structure Diagram', and how does it represent a program differently than a flowchart?",
                            marks: 2,
                            markingScheme:"Award 1 mark for describing a structure diagram (for example: It uses boxes to break down a program into smaller, manageable parts (top-down approach)). Award 1 additional mark for comparing it to a flowchart (for example, flowcharts are read by following the arrows, structure diagrams are read left to right.) ",
                        },
                        {
                            type: "paragraph",
                            text: "In a structure diagram, if a box labelled \"Calculate Grade\" is positioned below a box labelled \"Main Program\", what is the relationship between these two boxes called?",
                            marks: 1,
                            markingScheme:"Award 1 mark for 'Parent and child' or an answer with a similar meaning.",
                        },
                    ],
                },
                variables: {
                    questions: [ 
                        {
                        type: "paragraph",
                        text: "State two rules that must be followed when naming a variable.",
                        marks: 2,
                        markingScheme:"Award 1 mark for each answer to a maximum of 2 marks.  Students can answer with any two of: 'Must start with a letter/underscore', 'only letters/numbers/underscores', 'cannot be a keyword', 'is case sensitive', 'must be descriptive'.  The student's language may vary here, look for the meaning.",
                        },
                        {
                            type: "paragraph",
                            text: "Why is it considered good practice to use 'descriptive' names for variables?",
                            marks: 1,
                            markingScheme:"Award 1 mark for 'It helps the programmer/computer understand what the variable is being used for.' or an answer with a similar meaning.",
                        },
                        {
                            type: "paragraph",
                            text: "Explain the difference between the <b>String</b> datatype and the <b>Integer</b> datatype.",
                            marks: 2,
                            markingScheme:"Award 1 mark for knowledge of strings being used for alphanumeric text.  Award 1 mark for knowledge of integers being used for whole numbers (not just 'numbers')",
                        },
                        {
                            type: "paragraph",
                            text: "Which data type would be most appropriate for storing a person's name?",
                            marks: 2,
                            markingScheme:"Award 1 mark for 'String'.",
                        },
                        {
                            type: "paragraph",
                            text: "If a program tries to calculate <span class=\"codeText\">10 + \"cats\"</span>, what is likely to happen and why?",
                            marks: 2,
                            markingScheme:"Award 1 mark for 'The program will crash because computers cannot easily add a word (string) to a number (integer).' or a similar answer.",
                        },
                    ],
                },
            };
