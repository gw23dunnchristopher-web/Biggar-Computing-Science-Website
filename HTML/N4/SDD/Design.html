        <script>
            window.QUIZ_CONFIGS = {
                readingPseudocode: {
                    questions: [
                        {
                            type: "paragraph",
                            text: "According to the logic in steps 7 through 10, how much would a ticket cost for a person who is exactly 18                                 years old? Please explain your answer.",
                            marks: 2,
                            markingScheme:
                                "Award 1 mark for stating 15, or £15.00. Award 1 mark for explaining that the age is greater than or equal                       to 18, so the cost is £15.00.",
                        },
                        {
                            type: "paragraph",
                            text: "If a user enters 3 for the number of tickets and provides the age 12, 25 and 17 when asked, what will the                                 final cost be at step 14?",
                            marks: 1,
                            markingScheme:
                                "Award 1 mark for 35, the student may also say £35.00.",
                        },
                        {
                            type: "paragraph",
                            text: "You can see that lines 5 to 12 are indented, and lines 8 and 10 are indented even further.  Why do you                                     think this is?",
                            marks: 2,
                            markingScheme:
                                "Award 1 mark for explaining that the indentation shows that lines 5 to 12 are part of the loop. Award 1                         mark for explaining that the indentation shows that these lines are part of or are outcomes of the decision (or if                             statement).",
                        },
                    ],
                },
                readingFlowcharts: {
                    questions: [
                        {
                            type: "paragraph",
                            text: "In the first column, there is a set of steps that repeats several times. Can you count how many times the                                   program will ask the user to 'Enter steps for the day' before it finally moves on to the second column?",
                            marks: 1,
                            markingScheme:
                                "Award 1 mark for stating 7, or 7 times.",
                        },
                        {
                            type: "paragraph",
                            text: "Look at the second column of the flowchart. If a person's <b>Total steps</b> for the whole week was <b>8,000</b>, follow the arrows from the diamond. Which message will the computer display: <b>Goal Achieved!</b> or <b>Keep walking!</b>?  Explain why you chose that answer.",
                            marks: 2,
                            markingScheme:
                                "Award 1 mark for stating 'Keep walking!' and award 1 additional marking for explaining that it is because                                     8000 is less than 10000.",
                        },
                        {
                            type: "paragraph",
                            text: "Explain, in your own words what this program does.",
                            marks: 3,
                            markingScheme:
                                "Award 1 mark for stating that the program will ask you to enter your daily steps 7 times (or for a week).                                      Award 1 mark for saying that it will add all of the numbers entered together.  Award 1 mark for explaning                                      that the program will display whether you have reached your goal or not depending on the number of steps                                       entered.",
                        },
                    ],
                },
                readingStruct: {
                    questions: [
                        {
                            type: "paragraph",
                            text: "Looking at the very top level (the three boxes directly below the main Program title), what is the                                 final main step the program performs?",
                            marks: 1,
                            markingScheme: "Display total profit for the year.",
                        },
                        {
                            type: "paragraph",
                            text: "The purple oval says 'Repeat 12 times'. Which four specific tasks are performed 12 times?",
                            marks: 2,
                            markingScheme:
                                "The four actions are 'Get this month's total income', 'Get total expenses for this month', 'Calculate profit                                  for this month' and 'Add this month's profit to the total profit for the year.'  Award 1 mark for any two                                      correct answers and award 2 mark for all four correct answers.",
                        },
                        {
                            type: "paragraph",
                            text: "If the answer to the green hexagon ('Is monthly profit more than 0?') is 'Yes', how many actions does the                                 program take?  Which actions does it take?",
                            marks: 2,
                            markingScheme:
                                "Award 1 mark stating that the program will perform 2 additional actions, award an additional mark if they                                     answer describes the two actions - add monthly profit to yearly profit and display 'you made a profit this                                     month'.",
                        },
                    ],
                },
                writingPseudocode: {
                    questions: [
                        {
                            type: "pseudocode",
                            text: [
                                "<b>Program 1: The Temperature Warning</b>",
                                "A greenhouse needs a warning system for its plants.",
                                [
                                    "<b>Input:</b> The current temperature.",
                                    "<b>Process:</b> Check if the temperature is less than 5 degrees.",
                                    "<b>Output:</b> If the temperature is less than 5, display the warning 'Too cold!'. Otherwise, display                                         'Temperature is OK'.",
                                ],
                            ],
                            marks: 2,
                            markingScheme:
                                "Award 1 mark for the correct input and output (receiving the temperature and displaying a message).  Award 1                                  mark for the correct selection logic (using an If with 'tempreature less than 5' and Otherwise/Else)",
                        },
                        {
                            type: "pseudocode",
                            text: [
                                "<b>Program 2: The 10-Question Quiz Score</b>",
                                "A teacher wants a program to calculate a total score for a 10-question True or False' quiz.",
                                [
                                    " <b>Input:</b> For each of the 10 questions, ask the user if the answer was 'Correct' or 'Incorrect'.",
                                    "<b>Process:</b> Start a loop that repeats 10 times. Every time the user enters 'Correct', add 1 to the                                         total score.",
                                    " <b>Output:</b> IAfter the loop, display 'Your final score is: ' followed by the total score.",
                                ],
                            ],
                            marks: 4,
                            markingScheme:
                                "Award 1 mark for initialising the total (setting total to 0) before the loop, award 1 mark for the correct                                     loop logic (a loop that repeats 10 times). Award 1 mark for the selection logic inside the loop (only adding                                   a point if the answer is correct). Award 1 mark for the correct output (displaying the total score) after the                                  loop has finished.",
                        },
                        {
                            type: "pseudocode",
                            text: [
                                "<b>Program 3: The 12-Moth Rainfall Tracker</b>",
                                "A weather station tracks how much rain falls over a full year to get a monthly average",
                                [
                                    "<b>Input:</b> The amount of rain (in mm) for each of the 12 months.",
                                    "<b>Process:</b> Start a loop for 12 months. In each loop, get the rainfall amount and add it to a yearly                                      total. Divide the total by 12 to get the average.",
                                    "<b>Output:</b> Display the average rainfall for the year.",
                                ],
                            ],
                            marks: 4,
                            markingScheme:
                                "Award 1 mark for setting the yearly total to 0 before the loop starts.  Award 1 mark for correctly using a                                     loop that repeats exactly 12 times. Award 1 mark for adding the new input to the running total inside the                                      loop. Award 1 mark for getting the average rainfall by dividing the yearly total by 12 after the loop has                                      finished.",
                        },
                    ],
                },
            };
        </script>
