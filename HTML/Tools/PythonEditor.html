<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>BHS Computing Science - Python Editor</title>
        <link rel="stylesheet" href="/CSS/styles.css" />
        <link rel="stylesheet" href="/CSS/frameStyles.css" />
        <link rel="stylesheet" href="/CSS/sidebarStyles.css" />
        <link rel="stylesheet" href="/CSS/codeRunner.css" />
        <link rel="stylesheet" href="/CSS/codeProjects.css" />
        <script>
            function getSidebarForLevel() {
                var params = new URLSearchParams(window.location.search);
                var level = (params.get('level') || 'n5').toLowerCase();
                if (level === 'n4') return '/HTML/N4/N4Sidebar.html';
                if (level === 'higher') return '/HTML/Higher/HigherSidebar.html';
                return '/HTML/N5/N5Sidebar.html';
            }
            function getLevelLabel() {
                var params = new URLSearchParams(window.location.search);
                var level = (params.get('level') || 'n5').toLowerCase();
                if (level === 'n4') return 'National 4';
                if (level === 'higher') return 'Higher';
                return 'National 5';
            }
        </script>
        <script src="/JavaScript/script.js"></script>
        <script src="/JavaScript/zipWriter.js"></script>
        <script src="/JavaScript/codeProjects.js"></script>
        <script src="/JavaScript/codeRunner.js"></script>
        <style>
            #pageContainer {
                padding-bottom: 0 !important;
                overflow: hidden !important;
                height: calc(100vh - 150px) !important;
                min-height: unset !important;
            }
            #content {
                padding: 0 !important;
                overflow: hidden !important;
                display: flex !important;
                flex-direction: column !important;
                text-align: left !important;
            }

            .tool-header {
                flex-shrink: 0;
                background: #1e1e2e;
                color: #cdd6f4;
                padding: 8px 16px;
                display: flex;
                align-items: center;
                gap: 12px;
                border-bottom: 2px solid #313244;
                font-family: Arial, sans-serif;
                font-size: 13px;
            }
            .tool-header-icon { font-size: 20px; flex-shrink: 0; }
            .tool-header-title {
                font-weight: bold;
                font-size: 15px;
                color: #a6e3a1;
                flex-shrink: 0;
            }
            .tool-header-desc { color: #6c7086; font-size: 12px; }

            .tool-editor-wrap {
                flex: 1;
                min-height: 0;
                overflow: hidden;
                display: flex;
                flex-direction: column;
            }

            .tool-editor-wrap .code-runner {
                width: 100% !important;
                margin: 0 !important;
                border-radius: 0 !important;
                box-shadow: none !important;
                flex: 1 !important;
                display: flex !important;
                flex-direction: column !important;
                min-height: 0 !important;
                overflow: hidden !important;
            }

            .tool-editor-wrap .cr-editor-wrap {
                flex: 2 !important;
                min-height: 120px !important;
                resize: none !important;
                overflow: hidden !important;
            }
            .tool-editor-wrap .cr-py-hl-wrap {
                flex: 1 !important;
                min-height: 0 !important;
            }

            .tool-editor-wrap .cr-output-area {
                flex: 1 !important;
                display: flex !important;
                flex-direction: column !important;
                min-height: 0 !important;
            }
            .tool-editor-wrap .cr-terminal {
                flex: 1 !important;
                min-height: 80px !important;
                max-height: none !important;
                resize: none !important;
            }
        </style>
    </head>
    <body onload="loadSidebar(getSidebarForLevel(), 'sidebar')">
        <div id="loading"></div>
        <div id="mainContent" class="content-hidden">
            <header>
                <h1>BHS Computing Science</h1>
                <img src="/Images/Header/banner.png" />
            </header>
            <div id="pageContainer">
                <button class="toggle-btn" onclick="toggleSidebar()">&#9776;</button>
                <div id="sidebar"></div>
                <div id="content">
                    <div id="mainHeading"><h1 id="levelLabel">Computing Science</h1></div>
                    <div class="tool-header" id="toolHeader">
                        <span class="tool-header-icon">&#x1F40D;</span>
                        <span class="tool-header-title">Python Editor</span>
                        <span class="tool-header-desc" id="toolHeaderDesc">Your personal Python projects &mdash; create as many as you like. Each one is saved to this browser automatically.</span>
                    </div>
                    <div id="toolBody" class="tool-editor-wrap">
                        <!-- Either dashboard or editor is injected here by the script below -->
                    </div>
                </div>
            </div>
            <footer>
                <div id="left">
                    <p>Biggar High School</p>
                    <p>Market Rd, Biggar</p>
                    <p>ML12 6AG</p>
                </div>
                <div id="center"></div>
                <div id="right">
                    <p>&copy;C Dunn, 2025</p>
                </div>
            </footer>
        </div>
        <script>
            document.getElementById('levelLabel').textContent = getLevelLabel();

            (function () {
                var KIND = 'python';
                var STARTER = '# Write your Python program here\nprint("Hello, world!")\n';
                var params = new URLSearchParams(window.location.search);
                var projectId = params.get('project');
                var body = document.getElementById('toolBody');
                var headerDesc = document.getElementById('toolHeaderDesc');
                var header = document.getElementById('toolHeader');

                function escapeHtml(s) {
                    return String(s).replace(/[&<>"']/g, function (c) {
                        return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
                    });
                }

                function fmtDate(ts) {
                    if (!ts) return '';
                    var d = new Date(ts);
                    return d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                }

                function basePath() {
                    return window.location.pathname + '?level=' + (params.get('level') || 'n5');
                }

                function showModal(html, onMount) {
                    var bg = document.createElement('div');
                    bg.className = 'cp-modal-backdrop';
                    bg.innerHTML = '<div class="cp-modal">' + html + '</div>';
                    document.body.appendChild(bg);
                    function close() { document.body.removeChild(bg); }
                    bg.addEventListener('click', function (e) { if (e.target === bg) close(); });
                    if (onMount) onMount(bg.querySelector('.cp-modal'), close);
                    return close;
                }

                function promptName(initial, title) {
                    return new Promise(function (resolve) {
                        showModal(
                            '<h3>' + escapeHtml(title || 'Name your project') + '</h3>' +
                            '<input type="text" id="cpNameInput" value="' + escapeHtml(initial || '') + '" placeholder="My program" />' +
                            '<div class="cp-modal-buttons">' +
                            '  <button id="cpCancel">Cancel</button>' +
                            '  <button class="cp-primary" id="cpOk">OK</button>' +
                            '</div>',
                            function (modal, close) {
                                var input = modal.querySelector('#cpNameInput');
                                input.focus();
                                input.select();
                                modal.querySelector('#cpCancel').onclick = function () { close(); resolve(null); };
                                modal.querySelector('#cpOk').onclick = function () {
                                    var v = input.value.trim();
                                    if (!v) return;
                                    close(); resolve(v);
                                };
                                input.addEventListener('keydown', function (e) {
                                    if (e.key === 'Enter') modal.querySelector('#cpOk').click();
                                    if (e.key === 'Escape') modal.querySelector('#cpCancel').click();
                                });
                            }
                        );
                    });
                }

                function confirmDelete(name) {
                    return new Promise(function (resolve) {
                        showModal(
                            '<h3>Delete project?</h3>' +
                            '<p>Are you sure you want to delete <strong>"' + escapeHtml(name) + '"</strong>? This cannot be undone.</p>' +
                            '<div class="cp-modal-buttons">' +
                            '  <button id="cpCancel">Cancel</button>' +
                            '  <button class="cp-danger" id="cpOk">Delete</button>' +
                            '</div>',
                            function (modal, close) {
                                modal.querySelector('#cpCancel').onclick = function () { close(); resolve(false); };
                                modal.querySelector('#cpOk').onclick = function () { close(); resolve(true); };
                            }
                        );
                    });
                }

                async function renderDashboard() {
                    body.innerHTML = '<div class="cp-dashboard cp-theme-python"><p class="cp-sub">Loading…</p></div>';
                    var projects = [];
                    try { projects = await CodeProjects.list(KIND); }
                    catch (e) {
                        body.innerHTML = '<div class="cp-dashboard cp-theme-python"><p class="cp-sub">Could not load your projects. Please refresh.</p></div>';
                        return;
                    }
                    var modeNote = CodeProjects.isCloud()
                        ? 'Saved to your account — your projects follow you to any device.'
                        : 'Saved to this browser only. <a href="#" id="cpLoginLink">Log in</a> to keep your projects across devices.';
                    var html = '<div class="cp-dashboard cp-theme-python">' +
                        '<h2>Good day</h2>' +
                        '<p class="cp-sub">' + modeNote + '</p>' +
                        '<div class="cp-grid">' +
                        '<div class="cp-tile cp-tile-create" id="cpNewBtn" role="button" tabindex="0">' +
                        '  <div class="cp-plus">+</div>' +
                        '  <div>New Python Project</div>' +
                        '</div>' +
                        projects.map(function (p) {
                            return '<div class="cp-tile" data-id="' + p.id + '" role="button" tabindex="0">' +
                                '<button class="cp-tile-delete" data-del="' + p.id + '" title="Delete project">&times;</button>' +
                                '<div class="cp-tile-name">' + escapeHtml(p.name) + '</div>' +
                                '<div class="cp-tile-meta">Updated ' + escapeHtml(fmtDate(p.updatedAt)) + '</div>' +
                                '</div>';
                        }).join('') +
                        '</div></div>';
                    body.innerHTML = html;

                    var loginLink = body.querySelector('#cpLoginLink');
                    if (loginLink) loginLink.addEventListener('click', function (e) {
                        e.preventDefault();
                        if (window.SiteAuth && window.SiteAuth.openLogin) window.SiteAuth.openLogin();
                    });

                    body.querySelector('#cpNewBtn').addEventListener('click', async function () {
                        var name = await promptName('My program', 'New Python project');
                        if (!name) return;
                        try {
                            var p = await CodeProjects.create(KIND, name, STARTER);
                            window.location.href = basePath() + '&project=' + encodeURIComponent(p.id);
                        } catch (e) {
                            alert('Could not create project: ' + (e && e.message ? e.message : 'unknown error'));
                        }
                    });

                    body.querySelectorAll('.cp-tile[data-id]').forEach(function (tile) {
                        tile.addEventListener('click', function (e) {
                            if (e.target.closest('[data-del]')) return;
                            window.location.href = basePath() + '&project=' + encodeURIComponent(tile.dataset.id);
                        });
                    });
                    body.querySelectorAll('[data-del]').forEach(function (btn) {
                        btn.addEventListener('click', async function (e) {
                            e.stopPropagation();
                            var id = btn.dataset.del;
                            var p = await CodeProjects.get(KIND, id);
                            if (!p) return;
                            var ok = await confirmDelete(p.name);
                            if (!ok) return;
                            try { await CodeProjects.remove(KIND, id); } catch (_) {}
                            renderDashboard();
                        });
                    });

                    // If the student just logged in and has guest projects sitting in
                    // localStorage, offer to import them to their account.
                    CodeProjects.maybePromptImport(KIND, function (info) {
                        showModal(
                            '<h3>Import your saved projects?</h3>' +
                            '<p>You have <strong>' + info.count + '</strong> Python project' + (info.count === 1 ? '' : 's') +
                            ' saved on this device. Would you like to copy them into your account so you can open them on any computer?</p>' +
                            '<div class="cp-modal-buttons">' +
                            '  <button id="cpSkip">Not now</button>' +
                            '  <button class="cp-primary" id="cpImport">Import</button>' +
                            '</div>',
                            function (modal, close) {
                                modal.querySelector('#cpSkip').onclick = function () { info.skip(); close(); };
                                modal.querySelector('#cpImport').onclick = async function () {
                                    var btn = modal.querySelector('#cpImport');
                                    btn.disabled = true; btn.textContent = 'Importing…';
                                    try { await info.doImport(); } catch (_) {}
                                    close();
                                    renderDashboard();
                                };
                            }
                        );
                    });
                }

                function renderEditor(project) {
                    headerDesc.textContent = 'Use Upload to load CSV/TXT data files, Run to execute, Reset to clear.';

                    // Inject back-button + project name into the header
                    var existingBack = header.querySelector('.cp-back-link');
                    if (!existingBack) {
                        var back = document.createElement('a');
                        back.className = 'cp-back-link';
                        back.href = basePath();
                        back.innerHTML = '&larr; Projects';
                        header.insertBefore(back, header.firstChild);
                    }
                    var existingName = header.querySelector('.cp-project-name');
                    if (existingName) existingName.remove();
                    var nameSpan = document.createElement('span');
                    nameSpan.className = 'cp-project-name';
                    nameSpan.textContent = project.name;
                    nameSpan.title = 'Click to rename';
                    nameSpan.style.cursor = 'pointer';
                    nameSpan.addEventListener('click', async function () {
                        var newName = await promptName(project.name, 'Rename project');
                        if (!newName) return;
                        try { await CodeProjects.updateName(KIND, project.id, newName); } catch (_) {}
                        project.name = newName;
                        nameSpan.textContent = newName;
                    });
                    header.insertBefore(nameSpan, header.querySelector('.tool-header-desc'));

                    // Build the runner
                    var wrap = document.createElement('div');
                    wrap.className = 'py-runner';
                    wrap.setAttribute('data-filetree', 'true');
                    var ta = document.createElement('textarea');
                    ta.className = 'cr-code';
                    ta.setAttribute('data-filename', 'main.py');
                    ta.style.display = 'none';
                    ta.value = project.code || '';
                    wrap.appendChild(ta);
                    body.appendChild(wrap);

                    // Initialise the runner now that the textarea is ready.
                    if (window.CodeRunner && window.CodeRunner.initPy) {
                        window.CodeRunner.initPy(wrap);
                    }

                    // Auto-save the editor's content with a short debounce
                    var saveTimer = null;
                    function scheduleSave() {
                        clearTimeout(saveTimer);
                        saveTimer = setTimeout(function () {
                            var ed = wrap.querySelector('.cr-editor');
                            if (!ed) return;
                            CodeProjects.updateCode(KIND, project.id, ed.value).catch(function () { /* ignore transient save errors */ });
                        }, 600);
                    }
                    // The editor might be created asynchronously, so poll briefly
                    var attempts = 0;
                    var hookTimer = setInterval(function () {
                        var ed = wrap.querySelector('.cr-editor');
                        if (ed) {
                            ed.addEventListener('input', scheduleSave);
                            clearInterval(hookTimer);
                        } else if (++attempts > 50) {
                            clearInterval(hookTimer);
                        }
                    }, 100);
                }

                async function init() {
                    if (projectId) {
                        try {
                            var project = await CodeProjects.get(KIND, projectId);
                            if (project) { renderEditor(project); return; }
                        } catch (_) {}
                        // Project not found in the active backend — bounce to dashboard.
                        window.location.href = basePath();
                        return;
                    }
                    renderDashboard();
                }

                // Re-render when the student logs in or out so the dashboard
                // (or editor) reflects the active backend.
                CodeProjects.onChange(function () {
                    if (projectId) {
                        // The current project's id may not exist on the new backend.
                        window.location.href = basePath();
                    } else {
                        renderDashboard();
                    }
                });

                if (document.readyState === 'loading') {
                    document.addEventListener('DOMContentLoaded', init);
                } else {
                    init();
                }
            })();
        </script>
    </body>
</html>
