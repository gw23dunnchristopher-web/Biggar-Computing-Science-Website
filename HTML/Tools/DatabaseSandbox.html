<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>BHS Computing Science - Database Sandbox</title>
        <link rel="stylesheet" href="/CSS/styles.css" />
        <link rel="stylesheet" href="/CSS/frameStyles.css" />
        <link rel="stylesheet" href="/CSS/sidebarStyles.css" />
        <script src="/JavaScript/script.js"></script>
        <script>
            function getSidebarForLevel() {
                var params = new URLSearchParams(window.location.search);
                var level = (params.get('level') || 'n5').toLowerCase();
                if (level === 'n4') return '/HTML/N4/N4Sidebar.html';
                if (level === 'higher') return '/HTML/Higher/HigherSidebar.html';
                return '/HTML/N5/N5Sidebar.html';
            }
            function getLevelLabel() {
                var params = new URLSearchParams(window.location.search);
                var level = (params.get('level') || 'n5').toLowerCase();
                if (level === 'n4') return 'National 4';
                if (level === 'higher') return 'Higher';
                return 'National 5';
            }
        </script>
        <style>
            /* Override layout to fill available height */
            #pageContainer {
                padding-bottom: 0 !important;
                overflow: hidden !important;
                height: calc(100vh - 150px) !important;
                min-height: unset !important;
            }
            #content {
                padding: 0 !important;
                overflow: hidden !important;
                display: flex !important;
                flex-direction: column !important;
                text-align: left !important;
            }

            /* Slim tool header bar */
            .tool-header {
                flex-shrink: 0;
                background: #0f2518;
                color: #d4edda;
                padding: 8px 16px;
                display: flex;
                align-items: center;
                gap: 12px;
                border-bottom: 2px solid #27ae60;
                font-family: Arial, sans-serif;
                font-size: 13px;
            }
            .tool-header-icon {
                font-size: 20px;
                flex-shrink: 0;
            }
            .tool-header-title {
                font-weight: bold;
                font-size: 15px;
                color: #2ecc71;
                flex-shrink: 0;
            }
            .tool-header-desc {
                color: #7fbb96;
                font-size: 12px;
            }

            /* Iframe fills remaining space */
            .tool-editor-wrap {
                flex: 1;
                min-height: 0;
                overflow: hidden;
            }
            .db-sandbox-frame {
                width: 100%;
                height: 100%;
                border: none;
                display: block;
            }
        </style>
    </head>
    <body onload="loadSidebar(getSidebarForLevel(), 'sidebar')">
        <div id="loading"></div>
        <div id="mainContent" class="content-hidden">
            <header>
                <h1>BHS Computing Science</h1>
                <img src="/Images/Header/banner.png" />
            </header>
            <div id="pageContainer">
                <button class="toggle-btn" onclick="toggleSidebar()">&#9776;</button>
                <div id="sidebar"></div>
                <div id="content">
                    <div id="mainHeading"><h1 id="levelLabel">Computing Science</h1></div>
                    <div class="tool-header">
                        <span class="tool-header-icon">&#x1F4BE;</span>
                        <span class="tool-header-title">Database Sandbox</span>
                        <span class="tool-header-desc">Your own blank database &mdash; create tables, add fields, enter records and run queries. Work is saved to your personal copy automatically.</span>
                    </div>
                    <div class="tool-editor-wrap">
                        <div style="position:relative;width:100%;">
                    <iframe id="ds-embed-82da55672947124b65f9dad04fb891ec" src="/data-sculptor/?embed=82da55672947124b65f9dad04fb891ec" class="db-sandbox-frame" title="Database Sandbox" allowfullscreen></iframe>
                    <script>(function(){var f=document.getElementById('ds-embed-82da55672947124b65f9dad04fb891ec'),done=false;function ready(e){if(e&&e.data&&e.data.type==='ds-embed-ready'&&e.data.token==='82da55672947124b65f9dad04fb891ec'){done=true;window.removeEventListener('message',ready);}}window.addEventListener('message',ready);setTimeout(function(){if(!done){f.src='/data-sculptor/?embed=82da55672947124b65f9dad04fb891ec';}},6000);})();</script>
                    </div>
                    </div>
                </div>
            </div>
        </div>
        <script>
            document.getElementById('levelLabel').textContent = getLevelLabel();
        </script>
    </body>
</html>
