<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>BHS Computing Science - Database Sandbox</title>
        <link rel="stylesheet" href="/CSS/styles.css" />
        <link rel="stylesheet" href="/CSS/frameStyles.css" />
        <link rel="stylesheet" href="/CSS/sidebarStyles.css" />
        <script src="/JavaScript/script.js"></script>
        <script>
            function getSidebarForLevel() {
                var params = new URLSearchParams(window.location.search);
                var level = (params.get('level') || 'n5').toLowerCase();
                if (level === 'n4') return '/HTML/N4/N4Sidebar.html';
                if (level === 'higher') return '/HTML/Higher/HigherSidebar.html';
                return '/HTML/N5/N5Sidebar.html';
            }
            function getLevelLabel() {
                var params = new URLSearchParams(window.location.search);
                var level = (params.get('level') || 'n5').toLowerCase();
                if (level === 'n4') return 'National 4';
                if (level === 'higher') return 'Higher';
                return 'National 5';
            }
        </script>
        <style>
            /* Override layout to fill available height between heading and footer.
               Account for responsive variants in frameStyles.css that hide/shrink
               the BHS banner header at smaller viewports. */
            /* Slim tool header bar */
            .tool-header {
                position: fixed;
                top: 150px;     /* banner 100 + heading 50 */
                left: 320px;    /* sidebar width */
                right: 0;
                z-index: 5;
                background: #0f2518;
                color: #d4edda;
                padding: 6px 16px;
                display: flex;
                align-items: center;
                gap: 12px;
                font-family: Arial, sans-serif;
                font-size: 13px;
                box-sizing: border-box;
                height: 36px;
                white-space: nowrap;
            }
            .tool-header-icon { font-size: 18px; flex-shrink: 0; }
            .tool-header-title { font-weight: bold; font-size: 14px; color: #2ecc71; flex-shrink: 0; }
            .tool-header-desc {
                color: #7fbb96;
                font-size: 12px;
                overflow: hidden;
                text-overflow: ellipsis;
                min-width: 0;
            }

            /* Iframe fills the area between the tool header and the footer */
            .tool-editor-wrap {
                position: fixed;
                top: 186px;     /* tool header bottom = 150 + 36 */
                left: 320px;    /* sidebar width */
                right: 0;
                bottom: 50px;   /* footer height */
                overflow: hidden;
                background: #fff;
                display: flex;
                flex-direction: column;
            }
            .tool-editor-wrap > div {
                flex: 1 1 auto !important;
                display: flex !important;
                min-height: 0 !important;
                width: 100% !important;
                position: relative !important;
            }
            .db-sandbox-frame {
                flex: 1 1 auto;
                width: 100%;
                height: 100%;
                border: none;
                display: block;
            }

            /* Responsive: BHS banner is hidden under 800px tall, so the tool
               header / iframe move up by 100px. */
            @media (max-height: 800px) {
                .tool-header { top: 50px; }
                .tool-editor-wrap { top: 90px; }
            }
            /* Mobile landscape: banner 50 + heading ~50, footer 30 */
            @media (max-height: 500px) and (orientation: landscape) {
                .tool-header { top: 100px; }
                .tool-editor-wrap { top: 140px; bottom: 30px; }
            }
            /* Mobile (sidebar collapses, no left offset) */
            @media (max-width: 768px) {
                .tool-header, .tool-editor-wrap { left: 0; }
            }
        </style>
    </head>
    <body onload="loadSidebar(getSidebarForLevel(), 'sidebar')">
        <div id="loading"></div>
        <div id="mainContent" class="content-hidden">
            <header>
                <h1>BHS Computing Science</h1>
                <img src="/Images/Header/banner.png" />
            </header>
            <div id="pageContainer">
                <button class="toggle-btn" onclick="toggleSidebar()">&#9776;</button>
                <div id="sidebar"></div>
                <div id="content">
                    <div id="mainHeading"><h1 id="levelLabel">Computing Science</h1></div>
                    <div class="tool-header">
                        <span class="tool-header-icon">&#x1F4BE;</span>
                        <span class="tool-header-title">Database Sandbox</span>
                        <span class="tool-header-desc">Your own blank database &mdash; create tables, add fields, enter records and run queries. Work is saved to your personal copy automatically.</span>
                    </div>
                    <div class="tool-editor-wrap">
                        <div style="position:relative;width:100%;">
                    <iframe id="ds-embed-82da55672947124b65f9dad04fb891ec" src="/data-sculptor/?embed=82da55672947124b65f9dad04fb891ec" class="db-sandbox-frame" title="Database Sandbox" allowfullscreen></iframe>
                    <script>(function(){var f=document.getElementById('ds-embed-82da55672947124b65f9dad04fb891ec'),done=false;function ready(e){if(e&&e.data&&e.data.type==='ds-embed-ready'&&e.data.token==='82da55672947124b65f9dad04fb891ec'){done=true;window.removeEventListener('message',ready);}}window.addEventListener('message',ready);setTimeout(function(){if(!done){f.src='/data-sculptor/?embed=82da55672947124b65f9dad04fb891ec';}},6000);})();</script>
                    </div>
                    </div>
                </div>
            </div>
            <footer>
                <div id="left">
                    <p>Biggar High School</p>
                    <p>Market Rd, Biggar</p>
                    <p>ML12 6AG</p>
                </div>
                <div id="center"></div>
                <div id="right">
                    <p>&copy;C Dunn, 2025</p>
                </div>
            </footer>
        </div>
        <script>
            document.getElementById('levelLabel').textContent = getLevelLabel();
        </script>
    </body>
</html>
