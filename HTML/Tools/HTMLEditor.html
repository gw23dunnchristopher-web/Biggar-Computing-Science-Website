<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>BHS Computing Science - HTML Editor</title>
        <link rel="stylesheet" href="/CSS/styles.css" />
        <link rel="stylesheet" href="/CSS/frameStyles.css" />
        <link rel="stylesheet" href="/CSS/sidebarStyles.css" />
        <link rel="stylesheet" href="/CSS/codeRunner.css" />
        <script src="/JavaScript/script.js"></script>
        <script src="/JavaScript/zipWriter.js"></script>
        <script src="/JavaScript/codeRunner.js"></script>
        <script>
            function getSidebarForLevel() {
                var params = new URLSearchParams(window.location.search);
                var level = (params.get('level') || 'n5').toLowerCase();
                if (level === 'n4') return '/HTML/N4/N4Sidebar.html';
                if (level === 'higher') return '/HTML/Higher/HigherSidebar.html';
                return '/HTML/N5/N5Sidebar.html';
            }
            function getLevelLabel() {
                var params = new URLSearchParams(window.location.search);
                var level = (params.get('level') || 'n5').toLowerCase();
                if (level === 'n4') return 'National 4';
                if (level === 'higher') return 'Higher';
                return 'National 5';
            }
        </script>
        <style>
            /* Override layout to fill available height */
            #pageContainer {
                padding-bottom: 0 !important;
                overflow: hidden !important;
                height: calc(100vh - 150px) !important;
                min-height: unset !important;
            }
            #content {
                padding: 0 !important;
                overflow: hidden !important;
                display: flex !important;
                flex-direction: column !important;
                text-align: left !important;
            }

            /* Slim tool header bar */
            .tool-header {
                flex-shrink: 0;
                background: #1e1e2e;
                color: #cdd6f4;
                padding: 8px 16px;
                display: flex;
                align-items: center;
                gap: 12px;
                border-bottom: 2px solid #313244;
                font-family: Arial, sans-serif;
                font-size: 13px;
            }
            .tool-header-icon {
                font-size: 20px;
                flex-shrink: 0;
            }
            .tool-header-title {
                font-weight: bold;
                font-size: 15px;
                color: #fab387;
                flex-shrink: 0;
            }
            .tool-header-desc {
                color: #6c7086;
                font-size: 12px;
            }

            /* Make the runner container fill the remaining space */
            .tool-editor-wrap {
                flex: 1;
                min-height: 0;
                overflow: hidden;
                display: flex;
                flex-direction: column;
            }

            /* Override code-runner to fill its container */
            .tool-editor-wrap .code-runner {
                width: 100% !important;
                margin: 0 !important;
                border-radius: 0 !important;
                box-shadow: none !important;
                flex: 1 !important;
                display: flex !important;
                flex-direction: column !important;
                min-height: 0 !important;
                overflow: hidden !important;
            }

            /* Workspace (file tree + editor + preview) fills all remaining space */
            .tool-editor-wrap .cr-workspace {
                flex: 1 !important;
                min-height: 0 !important;
            }

            /* Editor highlight wrapper fills its flex slot */
            .tool-editor-wrap .cr-workspace .cr-hl-wrap {
                min-height: 0 !important;
                flex: 1 !important;
            }

            /* Preview iframe fills the right panel */
            .tool-editor-wrap .cr-preview {
                min-height: 0 !important;
                flex-shrink: 0;
            }

            /* File tree full height */
            .tool-editor-wrap .cr-filetree {
                min-height: 0 !important;
            }
            .tool-editor-wrap .cr-ft-body {
                flex: 1 !important;
                min-height: 0 !important;
            }
        </style>
    </head>
    <body onload="loadSidebar(getSidebarForLevel(), 'sidebar')">
        <div id="loading"></div>
        <div id="mainContent" class="content-hidden">
            <header>
                <h1>BHS Computing Science</h1>
                <img src="/Images/Header/banner.png" />
            </header>
            <div id="pageContainer">
                <button class="toggle-btn" onclick="toggleSidebar()">&#9776;</button>
                <div id="sidebar"></div>
                <div id="content">
                    <div id="mainHeading"><h1 id="levelLabel">Computing Science</h1></div>
                    <div class="tool-header">
                        <span class="tool-header-icon">&#x1F310;</span>
                        <span class="tool-header-title">HTML / CSS Editor</span>
                        <span class="tool-header-desc">Write HTML and CSS with a live preview &mdash; use the file tree to add files, <strong>Upload</strong> for images, <strong>Run</strong> to refresh the preview.</span>
                    </div>
                    <div class="tool-editor-wrap">
                        <div class="html-runner">
                            <textarea class="cr-code" style="display:none"><!DOCTYPE html>
<html>
<head>
    <title>My Webpage</title>
</head>
<body>

</body>
</html>
</textarea>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <script>
            document.getElementById('levelLabel').textContent = getLevelLabel();
        </script>
    </body>
</html>
