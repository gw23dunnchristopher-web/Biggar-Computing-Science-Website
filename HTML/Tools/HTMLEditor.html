<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>BHS Computing Science - HTML Editor</title>
        <link rel="stylesheet" href="/CSS/styles.css" />
        <link rel="stylesheet" href="/CSS/frameStyles.css" />
        <link rel="stylesheet" href="/CSS/sidebarStyles.css" />
        <link rel="stylesheet" href="/CSS/codeRunner.css" />
        <link rel="stylesheet" href="/CSS/codeProjects.css" />
        <script src="/JavaScript/script.js"></script>
        <script src="/JavaScript/zipWriter.js"></script>
        <script src="/JavaScript/codeProjects.js"></script>
        <script src="/JavaScript/codeRunner.js"></script>
        <script>
            function getSidebarForLevel() {
                var params = new URLSearchParams(window.location.search);
                var level = (params.get('level') || 'n5').toLowerCase();
                if (level === 'n4') return '/HTML/N4/N4Sidebar.html';
                if (level === 'higher') return '/HTML/Higher/HigherSidebar.html';
                return '/HTML/N5/N5Sidebar.html';
            }
            function getLevelLabel() {
                var params = new URLSearchParams(window.location.search);
                var level = (params.get('level') || 'n5').toLowerCase();
                if (level === 'n4') return 'National 4';
                if (level === 'higher') return 'Higher';
                return 'National 5';
            }
        </script>
        <style>
            #pageContainer {
                padding-bottom: 0 !important;
                overflow: hidden !important;
                height: calc(100vh - 150px) !important;
                min-height: unset !important;
            }
            #content {
                padding: 0 !important;
                overflow: hidden !important;
                display: flex !important;
                flex-direction: column !important;
                text-align: left !important;
            }

            .tool-header {
                flex-shrink: 0;
                background: #1e1e2e;
                color: #cdd6f4;
                padding: 8px 16px;
                display: flex;
                align-items: center;
                gap: 12px;
                border-bottom: 2px solid #313244;
                font-family: Arial, sans-serif;
                font-size: 13px;
            }
            .tool-header-icon { font-size: 20px; flex-shrink: 0; }
            .tool-header-title {
                font-weight: bold;
                font-size: 15px;
                color: #fab387;
                flex-shrink: 0;
            }
            .tool-header-desc { color: #6c7086; font-size: 12px; }

            .tool-editor-wrap {
                flex: 1;
                min-height: 0;
                overflow: hidden;
                display: flex;
                flex-direction: column;
            }

            .tool-editor-wrap .code-runner {
                width: 100% !important;
                margin: 0 !important;
                border-radius: 0 !important;
                box-shadow: none !important;
                flex: 1 !important;
                display: flex !important;
                flex-direction: column !important;
                min-height: 0 !important;
                overflow: hidden !important;
            }

            .tool-editor-wrap .cr-workspace {
                flex: 1 !important;
                min-height: 0 !important;
            }
            .tool-editor-wrap .cr-workspace .cr-hl-wrap {
                min-height: 0 !important;
                flex: 1 !important;
            }
            .tool-editor-wrap .cr-preview {
                min-height: 0 !important;
                flex-shrink: 0;
            }
            .tool-editor-wrap .cr-filetree {
                min-height: 0 !important;
            }
            .tool-editor-wrap .cr-ft-body {
                flex: 1 !important;
                min-height: 0 !important;
            }
        </style>
    </head>
    <body onload="loadSidebar(getSidebarForLevel(), 'sidebar')">
        <div id="loading"></div>
        <div id="mainContent" class="content-hidden">
            <header>
                <h1>BHS Computing Science</h1>
                <img src="/Images/Header/banner.png" />
            </header>
            <div id="pageContainer">
                <button class="toggle-btn" onclick="toggleSidebar()">&#9776;</button>
                <div id="sidebar"></div>
                <div id="content">
                    <div id="mainHeading"><h1 id="levelLabel">Computing Science</h1></div>
                    <div class="tool-header" id="toolHeader">
                        <span class="tool-header-icon">&#x1F310;</span>
                        <span class="tool-header-title">HTML / CSS Editor</span>
                        <span class="tool-header-desc" id="toolHeaderDesc">Your personal HTML &amp; CSS projects &mdash; create as many as you like. Each one is saved to this browser automatically.</span>
                    </div>
                    <div id="toolBody" class="tool-editor-wrap">
                        <!-- Either dashboard or editor is injected here by the script below -->
                    </div>
                </div>
            </div>
            <footer>
                <div id="left">
                    <p>Biggar High School</p>
                    <p>Market Rd, Biggar</p>
                    <p>ML12 6AG</p>
                </div>
                <div id="center"></div>
                <div id="right">
                    <p>&copy;C Dunn, 2025</p>
                </div>
            </footer>
        </div>
        <script>
            document.getElementById('levelLabel').textContent = getLevelLabel();

            (function () {
                var KIND = 'html';
                var STARTER = '<!DOCTYPE html>\n<html>\n<head>\n    <title>My Webpage</title>\n</head>\n<body>\n    <h1>Hello, world!</h1>\n</body>\n</html>\n';
                var params = new URLSearchParams(window.location.search);
                var projectId = params.get('project');
                var body = document.getElementById('toolBody');
                var headerDesc = document.getElementById('toolHeaderDesc');
                var header = document.getElementById('toolHeader');

                function escapeHtml(s) {
                    return String(s).replace(/[&<>"']/g, function (c) {
                        return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
                    });
                }

                function fmtDate(ts) {
                    if (!ts) return '';
                    var d = new Date(ts);
                    return d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                }

                function basePath() {
                    return window.location.pathname + '?level=' + (params.get('level') || 'n5');
                }

                function showModal(html, onMount) {
                    var bg = document.createElement('div');
                    bg.className = 'cp-modal-backdrop';
                    bg.innerHTML = '<div class="cp-modal">' + html + '</div>';
                    document.body.appendChild(bg);
                    function close() { document.body.removeChild(bg); }
                    bg.addEventListener('click', function (e) { if (e.target === bg) close(); });
                    if (onMount) onMount(bg.querySelector('.cp-modal'), close);
                    return close;
                }

                function promptName(initial, title) {
                    return new Promise(function (resolve) {
                        showModal(
                            '<h3>' + escapeHtml(title || 'Name your project') + '</h3>' +
                            '<input type="text" id="cpNameInput" value="' + escapeHtml(initial || '') + '" placeholder="My webpage" />' +
                            '<div class="cp-modal-buttons">' +
                            '  <button id="cpCancel">Cancel</button>' +
                            '  <button class="cp-primary" id="cpOk">OK</button>' +
                            '</div>',
                            function (modal, close) {
                                var input = modal.querySelector('#cpNameInput');
                                input.focus();
                                input.select();
                                modal.querySelector('#cpCancel').onclick = function () { close(); resolve(null); };
                                modal.querySelector('#cpOk').onclick = function () {
                                    var v = input.value.trim();
                                    if (!v) return;
                                    close(); resolve(v);
                                };
                                input.addEventListener('keydown', function (e) {
                                    if (e.key === 'Enter') modal.querySelector('#cpOk').click();
                                    if (e.key === 'Escape') modal.querySelector('#cpCancel').click();
                                });
                            }
                        );
                    });
                }

                function confirmDelete(name) {
                    return new Promise(function (resolve) {
                        showModal(
                            '<h3>Delete project?</h3>' +
                            '<p>Are you sure you want to delete <strong>"' + escapeHtml(name) + '"</strong>? This cannot be undone.</p>' +
                            '<div class="cp-modal-buttons">' +
                            '  <button id="cpCancel">Cancel</button>' +
                            '  <button class="cp-danger" id="cpOk">Delete</button>' +
                            '</div>',
                            function (modal, close) {
                                modal.querySelector('#cpCancel').onclick = function () { close(); resolve(false); };
                                modal.querySelector('#cpOk').onclick = function () { close(); resolve(true); };
                            }
                        );
                    });
                }

                function renderDashboard() {
                    var projects = CodeProjects.list(KIND);
                    var html = '<div class="cp-dashboard cp-theme-html">' +
                        '<h2>Good day</h2>' +
                        '<p class="cp-sub">Open a project to keep working on it, or create a new one.</p>' +
                        '<div class="cp-grid">' +
                        '<div class="cp-tile cp-tile-create" id="cpNewBtn" role="button" tabindex="0">' +
                        '  <div class="cp-plus">+</div>' +
                        '  <div>New HTML Project</div>' +
                        '</div>' +
                        projects.map(function (p) {
                            return '<div class="cp-tile" data-id="' + p.id + '" role="button" tabindex="0">' +
                                '<button class="cp-tile-delete" data-del="' + p.id + '" title="Delete project">&times;</button>' +
                                '<div class="cp-tile-name">' + escapeHtml(p.name) + '</div>' +
                                '<div class="cp-tile-meta">Updated ' + escapeHtml(fmtDate(p.updatedAt)) + '</div>' +
                                '</div>';
                        }).join('') +
                        '</div></div>';
                    body.innerHTML = html;

                    body.querySelector('#cpNewBtn').addEventListener('click', async function () {
                        var name = await promptName('My webpage', 'New HTML project');
                        if (!name) return;
                        var p = CodeProjects.create(KIND, name, STARTER);
                        window.location.href = basePath() + '&project=' + encodeURIComponent(p.id);
                    });

                    body.querySelectorAll('.cp-tile[data-id]').forEach(function (tile) {
                        tile.addEventListener('click', function (e) {
                            if (e.target.closest('[data-del]')) return;
                            window.location.href = basePath() + '&project=' + encodeURIComponent(tile.dataset.id);
                        });
                    });
                    body.querySelectorAll('[data-del]').forEach(function (btn) {
                        btn.addEventListener('click', async function (e) {
                            e.stopPropagation();
                            var id = btn.dataset.del;
                            var p = CodeProjects.get(KIND, id);
                            if (!p) return;
                            var ok = await confirmDelete(p.name);
                            if (!ok) return;
                            CodeProjects.remove(KIND, id);
                            renderDashboard();
                        });
                    });
                }

                function renderEditor(project) {
                    headerDesc.textContent = 'Use the file tree to add files, Upload for images, Run to refresh the preview.';

                    if (!header.querySelector('.cp-back-link')) {
                        var back = document.createElement('a');
                        back.className = 'cp-back-link';
                        back.href = basePath();
                        back.innerHTML = '&larr; Projects';
                        header.insertBefore(back, header.firstChild);
                    }
                    var existingName = header.querySelector('.cp-project-name');
                    if (existingName) existingName.remove();
                    var nameSpan = document.createElement('span');
                    nameSpan.className = 'cp-project-name';
                    nameSpan.textContent = project.name;
                    nameSpan.title = 'Click to rename';
                    nameSpan.style.cursor = 'pointer';
                    nameSpan.addEventListener('click', async function () {
                        var newName = await promptName(project.name, 'Rename project');
                        if (!newName) return;
                        CodeProjects.updateName(KIND, project.id, newName);
                        project.name = newName;
                        nameSpan.textContent = newName;
                    });
                    header.insertBefore(nameSpan, header.querySelector('.tool-header-desc'));

                    var wrap = document.createElement('div');
                    wrap.className = 'html-runner';
                    var ta = document.createElement('textarea');
                    ta.className = 'cr-code';
                    ta.style.display = 'none';
                    ta.value = project.code || '';
                    wrap.appendChild(ta);
                    body.appendChild(wrap);

                    if (window.CodeRunner && window.CodeRunner.initHtml) {
                        window.CodeRunner.initHtml(wrap);
                    }

                    var saveTimer = null;
                    function scheduleSave() {
                        clearTimeout(saveTimer);
                        saveTimer = setTimeout(function () {
                            var ed = wrap.querySelector('.cr-editor');
                            if (!ed) return;
                            CodeProjects.updateCode(KIND, project.id, ed.value);
                        }, 400);
                    }
                    var attempts = 0;
                    var hookTimer = setInterval(function () {
                        var ed = wrap.querySelector('.cr-editor');
                        if (ed) {
                            ed.addEventListener('input', scheduleSave);
                            clearInterval(hookTimer);
                        } else if (++attempts > 50) {
                            clearInterval(hookTimer);
                        }
                    }, 100);
                }

                function init() {
                    if (projectId) {
                        var project = CodeProjects.get(KIND, projectId);
                        if (project) { renderEditor(project); return; }
                    }
                    renderDashboard();
                }

                if (document.readyState === 'loading') {
                    document.addEventListener('DOMContentLoaded', init);
                } else {
                    init();
                }
            })();
        </script>
    </body>
</html>
